name: Rebuild and rescan pi template

# The one recorded failure (2026-07-11, f98a1a8) was not a flaky image build.
# Root cause: IMAGE_NAME was hardcoded to qunm00/ (the GitHub handle) in both
# this file and rebuild.sh, so pushes targeted a Docker Hub namespace that
# doesn't exist. Fixed in 1560c00, which set it to nmiquan/ (the Docker Hub
# handle) and passed 8 minutes later. The 19 runs since have all passed,
# including 5f4e47a, which changed the Dockerfile and built in CI.
# These triggers were disabled later in ae9499a on the hunch that the build
# was broken locally-but-fine-in-CI; it wasn't. Keep IMAGE_NAME and PLATFORMS
# in sync across this file and rebuild.sh -- that mismatch is what broke it
# before.
#
# Second recorded failure: builds ran on this amd64 runner with a plain
# `docker build`, so the published image was a single linux/amd64 manifest.
# Docker sandboxes run on the host arch (arm64 on Apple Silicon) with no CPU
# emulation, so `latest` was unusable there. rebuild.sh now builds a multi-arch
# index and fails if a platform is missing; the QEMU + buildx setup below is
# what lets this amd64 runner produce the arm64 leg. Don't drop either action.
on:
  # schedule:
  #   - cron: "0 0 * * 1"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'Dockerfile'
      - 'rebuild.sh'
      - '.github/workflows/rebuild-template.yml'

env:
  IMAGE_NAME: nmiquan/sbx-pi-template
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Runner is amd64; QEMU provides binfmt handlers so buildx can assemble
      # the linux/arm64 leg. Publishing both legs is the whole point -- sandboxes
      # have no CPU emulation, so a one-arch tag is broken on the other arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Docker Scout
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - name: Run rebuild script
        run: |
          chmod +x rebuild.sh
          ./rebuild.sh
